<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subscription Tracker · 订阅管理</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">💳</span>
      <div>
        <h1>Subscription Tracker</h1>
        <p>订阅管理 · 周期 / 费用 / 续费日 / 分类</p>
      </div>
    </div>
    <nav class="tabs">
      <button class="tab active" data-tab="subs">订阅列表</button>
      <button class="tab" data-tab="reminders">续费提醒<span id="reminder-badge" class="badge hidden"></span></button>
      <button class="tab" data-tab="cancelled">取消记录</button>
      <button class="tab" data-tab="stats">统计</button>
    </nav>
  </header>

  <main class="container">
    <!-- 仪表盘卡片 -->
    <section class="cards" id="dashboard">
      <div class="card accent">
        <div class="card-label">月度总支出</div>
        <div class="card-value" id="stat-monthly">--</div>
        <div class="card-foot">年化 <span id="stat-yearly">--</span></div>
      </div>
      <div class="card">
        <div class="card-label">活跃订阅</div>
        <div class="card-value" id="stat-active">--</div>
        <div class="card-foot">共 <span id="stat-total">--</span> 条记录</div>
      </div>
      <div class="card">
        <div class="card-label">近 30 天待续费</div>
        <div class="card-value" id="stat-upcoming">--</div>
        <div class="card-foot">7 天内 <span id="stat-upcoming7">--</span> 条</div>
      </div>
      <div class="card">
        <div class="card-label">已取消订阅</div>
        <div class="card-value" id="stat-cancelled">--</div>
        <div class="card-foot">每月节省 <span id="stat-saved">--</span></div>
      </div>
    </section>

    <!-- 订阅列表 -->
    <section id="panel-subs" class="panel active">
      <div class="panel-head">
        <h2>订阅列表 <span id="subs-count" class="muted"></span></h2>
        <button id="btn-add" class="btn primary">＋ 新增订阅</button>
      </div>
      <div class="toolbar">
        <input id="search-input" type="search" placeholder="🔍 搜索名称或备注…" />
        <select id="filter-category"><option value="">全部分类</option></select>
        <select id="filter-cycle">
          <option value="">全部周期</option>
          <option value="weekly">每周</option>
          <option value="monthly">每月</option>
          <option value="quarterly">每季</option>
          <option value="yearly">每年</option>
        </select>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>名称</th><th>分类</th><th>周期</th><th class="num">费用</th>
              <th>下次续费</th><th>状态</th><th class="actions">操作</th>
            </tr>
          </thead>
          <tbody id="subs-tbody"></tbody>
        </table>
      </div>
      <div id="subs-empty" class="empty hidden">没有符合条件的订阅</div>
    </section>

    <!-- 续费提醒 -->
    <section id="panel-reminders" class="panel">
      <div class="panel-head">
        <h2>续费提醒</h2>
        <div class="range">
          <button class="btn small range-btn" data-days="7">7 天内</button>
          <button class="btn small range-btn active" data-days="30">30 天内</button>
          <button class="btn small range-btn" data-days="90">90 天内</button>
        </div>
      </div>
      <div id="reminders-list" class="reminder-list"></div>
      <div id="reminders-empty" class="empty hidden">所选时间范围内没有待续费的订阅 🎉</div>
    </section>

    <!-- 取消记录 -->
    <section id="panel-cancelled" class="panel">
      <div class="panel-head">
        <h2>取消记录 <span id="cancelled-summary" class="muted"></span></h2>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>名称</th><th>分类</th><th>周期</th><th class="num">费用</th>
              <th>取消日期</th><th>备注</th><th class="actions">操作</th>
            </tr>
          </thead>
          <tbody id="cancelled-tbody"></tbody>
        </table>
      </div>
      <div id="cancelled-empty" class="empty hidden">还没有取消记录</div>
    </section>

    <!-- 统计 -->
    <section id="panel-stats" class="panel">
      <div class="panel-head"><h2>支出统计</h2></div>
      <div class="stats-grid">
        <div class="stat-block">
          <h3>分类占比（按月折算）</h3>
          <div id="stats-category" class="hbars"></div>
        </div>
        <div class="stat-block">
          <h3>近 6 个月支出趋势</h3>
          <div id="stats-trend" class="vbars"></div>
        </div>
        <div class="stat-block">
          <h3>计费周期分布</h3>
          <div id="stats-cycle" class="cycle-chips"></div>
          <h3>月费用 Top 5</h3>
          <div id="stats-top" class="top-list"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- 新增 / 编辑订阅弹窗 -->
  <dialog id="sub-dialog">
    <form id="sub-form" novalidate>
      <h3 id="dialog-title">新增订阅</h3>
      <label class="field">名称
        <input name="name" maxlength="60" placeholder="如：Netflix" required />
      </label>
      <div class="form-row">
        <label class="field">分类
          <input name="category" list="category-list" placeholder="选择或输入" />
        </label>
        <label class="field">计费周期
          <select name="cycle">
            <option value="weekly">每周</option>
            <option value="monthly" selected>每月</option>
            <option value="quarterly">每季</option>
            <option value="yearly">每年</option>
          </select>
        </label>
      </div>
      <div class="form-row">
        <label class="field">费用（元）
          <input name="price" type="number" min="0" step="0.01" placeholder="0.00" required />
        </label>
        <label class="field">下次续费日
          <input name="renewDate" type="date" required />
        </label>
      </div>
      <label class="field">备注
        <input name="notes" maxlength="200" placeholder="选填" />
      </label>
      <div class="form-actions">
        <button type="button" id="dialog-cancel" class="btn">取消</button>
        <button type="submit" class="btn primary">保存</button>
      </div>
    </form>
    <datalist id="category-list"></datalist>
  </dialog>

  <div id="toast"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
